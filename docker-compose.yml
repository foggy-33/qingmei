services:
  postgres:
    image: postgres:16
    container_name: review-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: review_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: review-redis
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: review-app-spring
    depends_on:
      - postgres
      - redis
    environment:
      HTTP_ADDR: ":8080"
      POSTGRES_DSN: "postgres://postgres:postgres@postgres:5432/review_platform?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      REDIS_DB: "0"
      STORAGE_DIR: "/app/storage"
      SHARE_BASE_URL: "http://localhost:8080"
      CACHE_TTL_SECONDS: "300"
      SHARE_DEFAULT_HOURS: "72"
    ports:
      - "8080:8080"
    volumes:
      - storage:/app/storage

  web:
    image: node:20-alpine
    container_name: review-web
    depends_on:
      - app
    working_dir: /app
    environment:
      VITE_API_BASE: "http://localhost:8080"
    command: sh -c "npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./web:/app
    ports:
      - "5173:5173"

volumes:
  pgdata:
  storage:
