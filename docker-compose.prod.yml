services:
  postgres:
    image: postgres:16
    container_name: qingmei-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-review_platform}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: qingmei-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

  app:
    build: .
    container_name: qingmei-app
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      HTTP_ADDR: ":8080"
      POSTGRES_DSN: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-review_platform}?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      REDIS_DB: "0"
      STORAGE_DIR: "/app/storage"
      SHARE_BASE_URL: "https://qm.upcshare.cn"
      CACHE_TTL_SECONDS: "300"
      SHARE_DEFAULT_HOURS: "72"
      AUTH_SESSION_HOURS: "72"
    volumes:
      - storage:/app/storage

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE: "https://qm.upcshare.cn"
    container_name: qingmei-web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  redisdata:
  storage:
  caddy_data:
  caddy_config:

